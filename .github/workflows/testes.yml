name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Rodar os testes
        run: npm test
      - name: Gerar a página única
        run: npm run build:unico
