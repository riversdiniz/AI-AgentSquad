<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI AgentSquad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dce5e1; --surface:#f6f9f7; --surface2:#e8efeb; --ink:#1d292c; --muted:#56676a; --line:#b4c3bd;
  --accent:#e3a32f; --accent-ink:#2a1d05; --alert:#c9443d; --ok:#2f8a5e; --info:#3570c4; --stage:#28373d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141d21; --surface:#1d282d; --surface2:#253238; --ink:#e3ebe7; --muted:#97a8a4; --line:#33444a;
    --alert:#e0625a; --ok:#4fb383; --info:#6b9be0; --stage:#0f171a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141d21; --surface:#1d282d; --surface2:#253238; --ink:#e3ebe7; --muted:#97a8a4; --line:#33444a;
  --alert:#e0625a; --ok:#4fb383; --info:#6b9be0; --stage:#0f171a; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif; }
h1,h2,h3{ font-family:"Pixelify Sans", "Atkinson Hyperlegible", system-ui, sans-serif; font-weight:600; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

.app{ display:grid; grid-template-columns:minmax(0,1fr) 330px; grid-template-rows:auto auto minmax(0,1fr); gap:12px; padding:12px; max-width:1500px; margin:0 auto; }
header{ grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; }
header h1{ margin:0; font-size:1.6rem; letter-spacing:.01em; }
header .sub{ color:var(--muted); font-size:.875rem; }
.counters{ display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:var(--surface); border:2px solid var(--line); font-size:.875rem; }
.chip b{ font-family:"Pixelify Sans",sans-serif; font-size:1.05rem; }
.chip.alert{ border-color:var(--alert); }
.chip.alert b{ color:var(--alert); }

.panel{ background:var(--surface); border:2px solid var(--line); box-shadow:4px 4px 0 var(--line); }
.stage{ grid-column:1; grid-row:2; position:relative; background:var(--stage); border:2px solid var(--line); box-shadow:4px 4px 0 var(--line); overflow:hidden; }
.stage canvas{ display:block; width:100%; touch-action:none; cursor:grab; }
.stage canvas.dragging{ cursor:grabbing; }
.toolbar{ position:absolute; left:8px; bottom:8px; display:flex; gap:6px; flex-wrap:wrap; }
.zoombar{ position:absolute; right:8px; bottom:8px; display:flex; gap:6px; }
.btn{ background:var(--surface); border:2px solid var(--ink); padding:5px 10px; cursor:pointer; box-shadow:2px 2px 0 var(--ink); font-size:.875rem; }
.btn:active{ transform:translate(2px,2px); box-shadow:none; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btn.primary{ background:var(--accent); color:var(--accent-ink); }
.btn.danger{ border-color:var(--alert); color:var(--alert); box-shadow:2px 2px 0 var(--alert); }
.btn.sq{ min-width:34px; font-family:"Pixelify Sans",sans-serif; font-weight:600; }
.toast{ position:absolute; top:8px; left:8px; right:8px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; pointer-events:none; }
.toast button{ pointer-events:auto; background:var(--alert); color:#fff; border:2px solid #fff; padding:5px 10px; cursor:pointer; font-size:.875rem; text-align:left; }

aside{ grid-column:2; grid-row:2/4; display:flex; flex-direction:column; gap:12px; min-width:0; }
aside section{ padding:12px; }
aside h2, .feed h2{ margin:0 0 8px; font-size:1.1rem; }
.list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
.list button{ width:100%; display:grid; grid-template-columns:14px 1fr auto; gap:8px; align-items:center; text-align:left; background:transparent; border:2px solid transparent; padding:5px 6px; cursor:pointer; }
.list button:hover{ background:var(--surface2); }
.list button[aria-pressed="true"]{ border-color:var(--accent); background:var(--surface2); }
.swatch{ width:14px; height:14px; border:2px solid var(--ink); }
.who small{ display:block; color:var(--muted); font-size:.8rem; }
.pill{ font-size:.75rem; padding:2px 6px; border:2px solid currentColor; white-space:nowrap; }
.s-trabalhando{ color:var(--info); } .s-precisa{ color:var(--alert); } .s-shell{ color:var(--ok); }
.s-ocioso{ color:var(--muted); } .s-chegando,.s-saindo{ color:var(--accent); }
.details p{ margin:4px 0; }
.details .label{ color:var(--muted); font-size:.8rem; display:block; margin-top:8px; }
.details .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.empty{ color:var(--muted); margin:0; }

.feed{ grid-column:1; grid-row:3; padding:12px; min-height:0; }
.feed ol{ list-style:none; margin:0; padding:0; max-height:190px; overflow:auto; font-size:.875rem; }
.feed li{ padding:3px 0; border-bottom:1px dashed var(--line); display:flex; gap:10px; }
.feed time{ color:var(--muted); font-variant-numeric:tabular-nums; flex:none; }
code{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.85em; background:var(--surface2); padding:0 4px; }

@media (max-width: 880px){
  .app{ grid-template-columns:1fr; }
  .stage,.feed,aside{ grid-column:1; grid-row:auto; }
  .counters{ margin-left:0; }
  .toast,.toolbar{ position:static; padding:8px; }
  .toast:empty{ display:none; }
  .zoombar{ bottom:auto; top:8px; }
}
@media (prefers-reduced-motion: reduce){ .btn:active{ transform:none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>AI AgentSquad</h1>
      <div class="sub" id="sub">Conectando ao servidor…</div>
    </div>
    <div class="counters" id="counters"></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="view" aria-label="Escritório em pixel art com os agentes" role="img"></canvas>
    <div class="toast" id="toast"></div>
    <div class="toolbar">
      <button class="btn primary" id="btnAdd">Adicionar agente</button>
      <button class="btn" id="btnDemo">Ligar demonstração</button>
      <button class="btn" id="btnPause">Pausar</button>
      <button class="btn" id="btnSpeed">Velocidade 1×</button>
      <button class="btn" id="btnHora">Hora: automática</button>
    </div>
    <div class="zoombar">
      <button class="btn sq" id="btnZoomOut" aria-label="Afastar">−</button>
      <button class="btn sq" id="btnZoomIn" aria-label="Aproximar">+</button>
      <button class="btn" id="btnFit">Ver tudo</button>
    </div>
  </div>

  <aside>
    <section class="panel">
      <h2>Agentes</h2>
      <ul class="list" id="list"></ul>
    </section>
    <section class="panel details" id="details"></section>
  </aside>

  <section class="panel feed">
    <h2>Atividade</h2>
    <ol id="feed"></ol>
  </section>
</div>
<script>
/* =====================================================================
   PLANTA DO ESCRITÓRIO
   Cada caractere é um tile. Quando a planta real chegar, basta redesenhar
   esta grade (o tamanho pode mudar). As paredes do fundo são automáticas
   nas bordas de cima (y=0) e da esquerda (x=0).

   Pisos:  .  escritório (madeira)   ,  cozinha (azulejo)   _  lounge (carpete)
           :  sala de jogos (emborrachado)   ;  banheiro (cerâmica)
   Móveis: c  cadeira de mesa (o agente senta aqui)   D  mesa (fica logo abaixo da cadeira)
           #  divisória   E  elevador   P  planta   W  bebedouro   R  estante
           K  bancada   C  máquina de café   F  geladeira   t  mesa da cozinha   o  banqueta
           V  TV   S  sofá   A  fliperama   L  luminária de chão
           I  pia com espelho   Q  vaso sanitário   G  mesa de ping-pong (2 tiles lado a lado)
   ===================================================================== */
const PLANTA = [
  "PRR..E.....WP#KKKCKKF,,P",
  ".............#,,,,,,,,,,",
  "..c..c..c..c.#,,,oo,,,,,",
  "..D..D..D..D.,,,,tt,,,,,",
  ".............#,,,oo,,,,,",
  ".............#######_###",
  "..c..c..c..c.#____V__AA_",
  "..D..D..D..D.#L________L",
  ".............#__________",
  ".............#___SSS____",
  "######.......#P_________",
  ";III;#.......#####:#####",
  ";;;;;;..c..c.#::::::::::",
  ";;;;;#..D..D.#:::GG:::::",
  "Q;Q;;#.......#::::::::::",
  ";;;;P#P.....P#P::::::::P",
];

const ROWS = PLANTA.length, COLS = PLANTA[0].length;
const at = (x, y) => (x < 0 || y < 0 || x >= COLS || y >= ROWS) ? null : PLANTA[y][x];
const FLOORS = ".,_:;";
const SEATS = "coS";
const walkable = (x, y) => { const c = at(x, y); return c !== null && (FLOORS.includes(c) || c === "E" || SEATS.includes(c)); };
function floorOf(x, y) {
  const c = at(x, y);
  if (c && FLOORS.includes(c)) return c;
  for (const [dx, dy] of [[1,0],[0,1],[-1,0],[0,-1]]) { const n = at(x+dx, y+dy); if (n && FLOORS.includes(n)) return n; }
  return ".";
}
function frontOf(x, y) {
  for (const [dx, dy] of [[0,1],[1,0],[-1,0],[0,-1]]) {
    const c = at(x+dx, y+dy);
    if (c && walkable(x+dx, y+dy) && !SEATS.includes(c)) return { x:x+dx, y:y+dy };
  }
  return null;
}
/* Para onde o personagem olha, a partir de uma direção na grade.
   O desenho base olha para a direita da tela; flip espelha. */
function faceDe(dx, dy) { const sdx = dx - dy, sdy = dx + dy; return { face: sdy > 0 ? "front" : "back", flip: sdx < 0 }; }

/* Lugares: mesas de trabalho e pontos da vida social */
const DESKS = [], SPOTS = [];
let ELEVATOR = { x:0, y:0 };
function addSpot(sx, sy, tx, ty, tipo, sit, seatH) {
  if (sx == null) return;
  SPOTS.push({ x:sx, y:sy, tipo, sit, seatH, key:`${sx},${sy}`, ...faceDe(tx - sx, ty - sy) });
}
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  const c = at(x, y);
  if (c === "c") DESKS.push({ x, y, key:`${x},${y}`, ...faceDe(0, 1) });
  if (c === "E") ELEVATOR = { x, y };
  if (c === "o") {
    const n = [[0,1],[0,-1],[1,0],[-1,0]].find(([dx,dy]) => at(x+dx,y+dy) === "t") || [0,1];
    addSpot(x, y, x+n[0], y+n[1], "conversa", true, 18);
  }
  if (c === "S") addSpot(x, y, x, y-1, "futebol", true, 16);
  const tipo = { C:"cafe", F:"cafe", W:"agua", A:"games", I:"espelho" }[c];
  if (tipo) { const f = frontOf(x, y); if (f) addSpot(f.x, f.y, x, y, tipo, false, 0); }
  if (c === "G") {
    if (at(x-1, y) !== "G" && walkable(x-1, y)) addSpot(x-1, y, x, y, "pingpong", false, 0);
    if (at(x+1, y) !== "G" && walkable(x+1, y)) addSpot(x+1, y, x, y, "pingpong", false, 0);
  }
}

/* =====================================================================
   PROJEÇÃO E RASTERIZAÇÃO
   Tudo passa por P(): é o único lugar que sabe que a vista é isométrica.
   Para uma vista de cima (ex.: sprites do LimeZu), troque P e a profundidade.
   ===================================================================== */
const HW = 32, HH = 16, WALL_H = 112;
const LW = (COLS + ROWS) * HW + 96;
const LH = (COLS + ROWS) * HH + WALL_H + 56;
const OX = ROWS * HW + 48, OY = WALL_H + 24;
const P = (x, y, z = 0) => ({ x: OX + (x - y) * HW, y: OY + (x + y) * HH - z });
const profundidade = (x, y) => x + y;

const low = document.createElement("canvas"); low.width = LW; low.height = LH;
const main = low.getContext("2d");
let g = main;                 // contexto atual (troca ao gerar sprites em cache)
const lightCanvas = document.createElement("canvas"); lightCanvas.width = LW; lightCanvas.height = LH;
const lg = lightCanvas.getContext("2d");
const view = document.getElementById("view");
const vg = view.getContext("2d");

function fillPoly(pts, col) {
  g.fillStyle = col;
  let minY = Infinity, maxY = -Infinity;
  for (const p of pts) { if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; }
  for (let y = Math.floor(minY); y < Math.ceil(maxY); y++) {
    const yc = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a.y <= yc && b.y > yc) || (b.y <= yc && a.y > yc)) xs.push(a.x + (yc - a.y) * (b.x - a.x) / (b.y - a.y));
    }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const x0 = Math.round(xs[k]), x1 = Math.round(xs[k + 1]);
      if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1);
    }
  }
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
  const m = v => Math.max(0, Math.min(255, Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f))));
  return "#" + [m(r), m(gg), m(b)].map(v => v.toString(16).padStart(2, "0")).join("");
}
function prism(x, y, w, d, z, h, col, o = {}) {
  const top = o.top || shade(col, 0.2), left = o.left || col, right = o.right || shade(col, -0.2);
  fillPoly([P(x, y+d, z), P(x+w, y+d, z), P(x+w, y+d, z+h), P(x, y+d, z+h)], left);
  fillPoly([P(x+w, y, z), P(x+w, y+d, z), P(x+w, y+d, z+h), P(x+w, y, z+h)], right);
  fillPoly([P(x, y, z+h), P(x+w, y, z+h), P(x+w, y+d, z+h), P(x, y+d, z+h)], top);
  if (o.edge !== false && h >= 4) {   // aresta clara no topo, típica de pixel art
    const a = P(x, y+d, z+h), b = P(x+w, y+d, z+h), c = P(x+w, y, z+h);
    fillPoly([a, b, { x:b.x, y:b.y+1 }, { x:a.x, y:a.y+1 }], o.hi || shade(col, 0.38));
    fillPoly([b, c, { x:c.x, y:c.y+1 }, { x:b.x, y:b.y+1 }], o.hi || shade(col, 0.3));
  }
}
const quadY = (Y, x0, x1, z0, z1, col) => fillPoly([P(x0,Y,z0), P(x1,Y,z0), P(x1,Y,z1), P(x0,Y,z1)], col);
const quadX = (X, y0, y1, z0, z1, col) => fillPoly([P(X,y0,z0), P(X,y1,z0), P(X,y1,z1), P(X,y0,z1)], col);
const quadZ = (x0, y0, x1, y1, z, col) => fillPoly([P(x0,y0,z), P(x1,y0,z), P(x1,y1,z), P(x0,y1,z)], col);
const tileDiamond = (x, y, col) => quadZ(x, y, x+1, y+1, 0, col);
function lineFloor(x0, y0, x1, y1, col, z = 0) { const a = P(x0, y0, z), b = P(x1, y1, z); fillPoly([a, b, { x:b.x, y:b.y+1 }, { x:a.x, y:a.y+1 }], col); }
const h2 = (x, y, i = 0) => { let h = Math.imul(x + 101, 374761393) ^ Math.imul(y + 37, 668265263) ^ Math.imul(i + 7, 2246822519); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

/* =====================================================================
   DIA E NOITE
   ===================================================================== */
const FASES = {
  dia:        { nome:"dia",        dark:0,    sky:["#6fbdf0", "#92cff4", "#bfe4f8"], noite:false },
  entardecer: { nome:"entardecer", dark:0.30, sky:["#4a568f", "#e2875a", "#f5c178"], noite:false, tint:"rgba(255,140,80,.10)" },
  noite:      { nome:"noite",      dark:0.64, sky:["#0b1229", "#141f45", "#22305c"], noite:true },
};
function faseAtual() {
  if (state.faseFixa) return state.faseFixa;
  const h = new Date().getHours();
  if (h >= 7 && h < 17) return "dia";
  if ((h >= 17 && h < 19) || (h >= 5 && h < 7)) return "entardecer";
  return "noite";
}

/* =====================================================================
   PISO E PAREDES (desenhados uma vez numa camada de fundo)
   ===================================================================== */
function drawFloorTile(x, y) {
  const f = floorOf(x, y), c = at(x, y);
  if (c === "E") {
    tileDiamond(x, y, "#7d878c");
    for (let i = 1; i < 4; i++) lineFloor(x + i/4, y, x + i/4, y + 1, "#6a7479");
    return;
  }
  if (f === ".") {
    tileDiamond(x, y, ["#c8955f", "#c18b56", "#cd9c68"][Math.floor(h2(x, y) * 3)]);
    for (let i = 1; i < 4; i++) lineFloor(x, y + i/4, x + 1, y + i/4, "#a87644");
    for (let i = 0; i < 4; i++) { const s = 0.15 + h2(x, y, i) * 0.7; lineFloor(x + s, y + i/4, x + s, y + (i+1)/4, "#a87644"); }
    for (let i = 0; i < 3; i++) { const p = P(x + h2(x,y,i+9), y + h2(x,y,i+19)); g.fillStyle = "#d6a876"; g.fillRect(Math.round(p.x), Math.round(p.y), 3, 1); }
  } else if (f === ",") {
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++)
      quadZ(x + i/2, y + j/2, x + (i+1)/2, y + (j+1)/2, 0, (i + j + x + y) % 2 ? "#eef1f3" : "#cfd7dc");
  } else if (f === "_") {
    tileDiamond(x, y, "#4b8580");
    for (let i = 0; i < 18; i++) { const p = P(x + h2(x,y,i), y + h2(x,y,i+40)); g.fillStyle = i % 2 ? "#579591" : "#417571"; g.fillRect(Math.round(p.x), Math.round(p.y), 2, 1); }
  } else if (f === ":") {
    tileDiamond(x, y, "#3c6aa3");
    for (let i = 0; i < 12; i++) { const p = P(x + h2(x,y,i), y + h2(x,y,i+40)); g.fillStyle = "#4677b2"; g.fillRect(Math.round(p.x), Math.round(p.y), 2, 1); }
  } else if (f === ";") {
    tileDiamond(x, y, "#eef3f5");
    for (let i = 1; i < 3; i++) { lineFloor(x + i/3, y, x + i/3, y + 1, "#d0dadf"); lineFloor(x, y + i/3, x + 1, y + i/3, "#d0dadf"); }
  }
}

function janelaY(x0, x1, F) {
  quadY(0, x0 - 0.06, x1 + 0.06, 40, 100, "#56666d");
  const z0 = 44, z1 = 96;
  for (let i = 0; i < 3; i++) quadY(0, x0 + 0.04, x1 - 0.04, z1 - (i+1) * 52/3, z1 - i * 52/3, F.sky[i]);
  for (let k = 0; k < 5; k++) {
    const w = (x1 - x0 - 0.08) / 5, bx = x0 + 0.04 + k * w, h = 6 + h2(k, Math.round(x0*10)) * 18;
    quadY(0, bx, bx + w - 0.02, z0, z0 + h, F.noite ? "#1a2235" : F.dark ? "#5b5f7d" : "#8aa0ae");
    if (F.noite) for (let j = 0; j < 3; j++) if (h2(k, j, Math.round(x0*7)) > 0.5) { const p = P(bx + 0.05 + j * 0.06, 0, z0 + 3 + j * 4 % h); g.fillStyle = "#f5d76e"; g.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
  }
  if (F.noite) {
    g.fillStyle = "#f4f1d0";
    for (let i = 0; i < 6; i++) { const p = P(x0 + 0.1 + h2(i, 3, Math.round(x0*3)) * (x1 - x0 - 0.2), 0, 70 + h2(i, 5, Math.round(x0)) * 24); g.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
    if (x0 > 6 && x0 < 8) { quadY(0, x0 + 0.25, x0 + 0.42, 82, 92, "#f4f1d0"); quadY(0, x0 + 0.32, x0 + 0.44, 84, 92, F.sky[0]); }
  } else if (!F.dark) {
    const cx = x0 + 0.2 + h2(1, Math.round(x0*5)) * (x1 - x0 - 0.7);
    quadY(0, cx, cx + 0.4, 80, 84, "#ffffff"); quadY(0, cx + 0.08, cx + 0.3, 84, 87, "#ffffff");
  }
  quadY(0, (x0 + x1)/2 - 0.02, (x0 + x1)/2 + 0.02, 44, 96, "#56666d");
  quadY(0, x0, x1, 69, 71, "#56666d");
  prism(x0 - 0.1, 0, x1 - x0 + 0.2, 0.12, 37, 3, "#eef2f3", { edge:false });
}
function janelaX(y0, y1, F) {

    quadX(0, by, by + w - 0.02, 44, 44 + h, F.noite ? "#161d2e" : F.dark ? "#52566f" : "#7d93a1");
  }
  quadX(0, (y0 + y1)/2 - 0.02, (y0 + y1)/2 + 0.02, 44, 96, "#4f5e65");
  quadX(0, y0, y1, 69, 71, "#4f5e65");

  for (let y = 0.5; y < ROWS; y += 0.5) quadX(0, y, y + 0.02, 42, WALL_H, "#b8c2c7");

  quadX(0, 0, ROWS, 0, 38, "#97a8ae"); quadX(0, 0, ROWS, 38, 42, "#d3dbde");

  quadY(0, 0, COLS, 0, 5, "#6e7e84"); quadX(0, 0, ROWS, 0, 5, "#62727a");
  // azulejo da cozinha
  quadY(0, 14, COLS, 38, 76, "#cfe7e2");
  for (let z = 47; z < 76; z += 9.5) quadY(0, 14, COLS, z, z + 1, "#b2d2cb");

  quadX(0, 11, ROWS, 5, 86, "#d9edf2");

  for (let y = 11; y <= ROWS; y += 0.25) quadX(0, y, y + 0.015, 5, 86, "#bcd8df");

  for (let col = 0; col < 3; col++) {
    quadX(0, 4.1 + col * 0.75, 4.12 + col * 0.75 + 0.7, 89, 90, "#c3ccd0");
    for (let r = 0; r < 4; r++) if (h2(col, r, 2) > 0.25) { const y0 = 4.18 + col * 0.75 + h2(col, r) * 0.25; quadX(0, y0, y0 + 0.28, 80 - r * 7.5, 85 - r * 7.5, cores[(col + r) % 4]); }
  }
  // quadro (paisagem) e relógio
  quadY(0, 3.1, 4.4, 56, 88, "#6b4a2f"); quadY(0, 3.16, 4.34, 59, 85, "#9fd3ee");
  quadY(0, 3.16, 4.34, 59, 68, "#5aa35e"); quadY(0, 3.6, 4.34, 59, 73, "#4b8f50"); quadY(0, 3.9, 4.05, 78, 81, "#ffe27a");
  const ex = ELEVATOR.x + 0.5;
  quadY(0, ex - 0.18, ex + 0.18, 94, 106, "#3b4448"); quadY(0, ex - 0.15, ex + 0.15, 95, 105, "#fbfbf5");
  const d = new Date(), hAng = ((d.getHours() % 12) + d.getMinutes() / 60) / 12 * Math.PI * 2, mAng = d.getMinutes() / 60 * Math.PI * 2;
  const cc = P(ex, 0, 100);

  for (let i = 0; i < 4; i++) { g.fillRect(Math.round(cc.x + Math.sin(mAng) * i * 1.1), Math.round(cc.y - Math.cos(mAng) * i * 1.1 + Math.sin(mAng) * i * 0.5), 1, 1); }
  for (let i = 0; i < 3; i++) { g.fillRect(Math.round(cc.x + Math.sin(hAng) * i * 1.1), Math.round(cc.y - Math.cos(hAng) * i * 1.1 + Math.sin(hAng) * i * 0.5), 1, 1); }
  // placa da sala de jogos e do banheiro (nas divisórias não há parede alta; fica no lambri do fundo)
}

function drawFloorAll() {
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) drawFloorTile(x, y);
  for (let x = 0; x < COLS; x++) fillPoly([P(x,ROWS,0), P(x+1,ROWS,0), P(x+1,ROWS,-12), P(x,ROWS,-12)], x % 2 ? "#5f4e3f" : "#5a4a3c");
  for (let y = 0; y < ROWS; y++) fillPoly([P(COLS,y,0), P(COLS,y+1,0), P(COLS,y+1,-12), P(COLS,y,-12)], y % 2 ? "#4c3f33" : "#483c31");
}

/* Camada de fundo em cache: refeita quando muda a fase do dia ou o minuto do relógio */
const bg = document.createElement("canvas"); bg.width = LW; bg.height = LH;
let bgKey = "";
function atualizarFundo() {
  const fase = faseAtual(), d = new Date();
  const key = fase + d.getHours() + ":" + d.getMinutes();
  if (key === bgKey) return;
  bgKey = key;
  const bctx = bg.getContext("2d");
  bctx.clearRect(0, 0, LW, LH);
  g = bctx;
  drawFloorAll();
  drawWalls(FASES[fase]);
  g = main;
}

/* Gera os sprites em cache: cada parte vira um canvas pequeno do tamanho do tile */
const MOV = [];
const LUZES_FIXAS = [];
function prepararMoveis() {
  MOV.length = 0; LUZES_FIXAS.length = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const fn = MOVEIS[at(x, y)];
    if (!fn) continue;
    const m = fn(x, y);
    const left = P(x, y + 1.3).x - 8, right = P(x + 1.3, y).x + 8, top = P(x, y).y - 150, bottom = P(x + 1, y + 1).y + 8;
    for (const parte of m.estatico || []) {
      const cv = document.createElement("canvas");
      cv.width = Math.ceil(right - left); cv.height = Math.ceil(bottom - top);
      const c2 = cv.getContext("2d");
      c2.translate(-Math.floor(left), -Math.floor(top));
      g = c2; parte.draw(); g = main;
      MOV.push({ depth: profundidade(x, y) + 1 + parte.d, kind:0, img: cv, ix: Math.floor(left), iy: Math.floor(top) });
    }
    for (const parte of m.dinamico || []) MOV.push({ depth: profundidade(x, y) + 1 + parte.d, kind:0, dyn: parte.draw });
    if (m.luz) LUZES_FIXAS.push({ dinamica: m.luz });
    if (m.luzFixa) LUZES_FIXAS.push({ ...m.luzFixa, zona: floorOf(x, y) });
  }
}
/* Gancho para um tema com sprites prontos: desenha uma imagem com a âncora no centro do tile. */
function spriteDeImagem(img, ancoraX, ancoraY) {
  return (x, y) => ({ estatico: [{ d:0, draw() { const p = P(x + 0.5, y + 0.5); g.drawImage(img, Math.round(p.x - ancoraX), Math.round(p.y - ancoraY)); } }] });
}

/* =====================================================================
   PERSONAGENS (pixel art gerada por código)
   Desenho base em 3/4 olhando para a direita da tela; flip espelha.
   face "front" mostra o rosto, "back" mostra a nuca.
   ===================================================================== */
const OUT = "#2a1f1b";
function drawAgent(a, t) {
  const c = P(a.px, a.py, 0);
  const sx = Math.round(c.x), sy = Math.round(c.y);
  const sit = a.sitting, seat = sit ? (a.seatH || 14) : 0;
  const by = sy - seat;
  const fl = a.flip ? -1 : 1, front = a.face === "front", pal = a.pal;
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(fl === 1 ? sx + x : sx - x - w, by + y, w, h); };
  const RB = (x, y, w, h, col) => { R(x - 1, y - 1, w + 2, h + 2, OUT); R(x, y, w, h, col); };

  // sombra

  if (a.leaving > 0) g.globalAlpha = Math.max(0, 1 - a.leaving);

  const f = a.walking ? Math.floor(a.walkT * 9) % 4 : 0;
  const lp = [0, 1, 0, -1][f];
  const uo = sit ? 14 : 0;                  // sentado, o tronco desce até o assento
  const pd = shade(pal.pants, -0.25), sd = shade(pal.shirt, -0.22), sk = pal.skin, skd = shade(pal.skin, -0.14);
  const act = a.status === "ocioso" && a.spot && a.arrived ? a.spot.tipo : null;

  // pernas
  if (!sit) {
    const la = lp > 0 ? 2 : 0, lb = lp < 0 ? 2 : 0;
    RB(-6, -16, 5, 16 - la, pal.pants); RB(1, -16, 5, 16 - lb, pd);
    RB(-6, -3 - la, 6, 3, pal.shoe); RB(1, -3 - lb, 6, 3, shade(pal.shoe, -0.2));
  } else if (front && a.atDesk) {
    RB(-7, -4, 14, 5, pal.pants);           // na mesa, as canelas ficam escondidas
  } else if (front) {
    RB(-7, -4, 14, 5, pal.pants);
    RB(-6, 1, 5, seat - 3, pal.pants); RB(1, 1, 5, seat - 3, pd);
    RB(-6, seat - 3, 6, 3, pal.shoe); RB(1, seat - 3, 6, 3, shade(pal.shoe, -0.2));
  }

  // tronco
  const ty = -32 + uo;
  RB(-9, ty, 18, 17, pal.shirt);
  R(5, ty, 4, 17, sd);
  if (pal.estilo === 1) R(-9, ty + 6, 18, 2, shade(pal.shirt, 0.35));
  if (front) {
    R(-2, ty, 4, 3, sk); R(-1, ty + 3, 2, 1, sk);
    if (pal.estilo === 2) { R(-1, ty + 3, 2, 9, pal.gravata); R(-2, ty + 3, 4, 2, pal.gravata); }
    if (pal.estilo === 3) { R(-4, ty + 2, 1, 6, "#f1f1f1"); R(3, ty + 2, 1, 6, "#f1f1f1"); }
  }
  R(-9, ty + 15, 18, 2, shade(pal.pants, -0.4));

  // braços
  const sw = a.walking ? lp * 2 : 0;
  const braco = (bx, y0, len, col) => { RB(bx, y0, 4, len, col); RB(bx, y0 + len, 4, 4, sk); };
  const typing = (a.status === "trabalhando" || a.status === "shell") && a.atDesk;
  const raising = a.status === "precisa" && a.atDesk;
  if (raising) {
    const wave = Math.floor(t * 4) % 2;

    RB(9, ty - 17 - wave, 4, 17, sd); RB(9, ty - 21 - wave, 4, 4, sk);

  } else if (act === "pingpong") {

    RB(9, ty + 1, 4, 8, sd); RB(12, ty + 6 + swing, 4, 4, sk);

  } else if (act === "cafe" || act === "conversa" || act === "agua") {
    const gole = Math.sin(t * 0.9 + a.seed) > 0.75;

    RB(4, ty - 21 + k * 2, 8, 2, "#d9534f");
  } else if (act === "games") {
    RB(-13, ty + 1, 4, 9, pal.shirt); RB(9, ty + 1, 4, 9, sd);
  } else {
    braco(-13, ty + 1 + sw, 12, pal.shirt);
    braco(9, ty + 1 - sw, 12, sd);
  }

  // cabeça
  const hy = ty - 17;
  R(-2, hy + 14, 4, 3, skd);
  RB(-8, hy, 16, 15, sk);
  R(5, hy, 3, 15, skd);
  const hair = pal.hair, hd = shade(pal.hair, -0.25);
  if (front) {
    R(-9, hy + 6, 2, 4, sk); R(-9, hy + 7, 1, 2, skd);
    switch (pal.cabelo) {
      case 0: RB(-9, hy - 3, 18, 6, hair); R(-9, hy + 3, 3, 4, hair); R(4, hy + 3, 5, 2, hair); break;
      case 1: RB(-9, hy - 3, 18, 6, hair); RB(-10, hy + 2, 4, 15, hair); RB(6, hy + 2, 4, 11, hd); R(-3, hy + 3, 9, 2, hair); break;
      case 2: RB(-9, hy - 3, 18, 6, hair); RB(-4, hy - 8, 9, 5, hair); R(-9, hy + 3, 3, 3, hair); break;
      case 3: RB(-10, hy - 6, 20, 11, hair); RB(-12, hy - 2, 3, 8, hair); RB(9, hy - 2, 3, 6, hd); R(-6, hy - 6, 3, 1, shade(hair, 0.2)); R(2, hy - 5, 3, 1, shade(hair, 0.2)); break;
    }
    R(-9, hy - 3, 18, 1, shade(hair, 0.25));
    if (pal.oculos) { R(-4, hy + 6, 5, 4, OUT); R(2, hy + 6, 5, 4, OUT); R(-3, hy + 7, 3, 2, "#cfe6f2"); R(3, hy + 7, 3, 2, "#cfe6f2"); R(1, hy + 7, 1, 1, OUT); }
    const piscar = ((t * 0.6 + a.seed) % 4) < 0.12;
    if (!pal.oculos) {
      R(-3, hy + 6, 2, piscar ? 1 : 3, "#1d1d1d"); R(3, hy + 6, 2, piscar ? 1 : 3, "#1d1d1d");
      if (!piscar) { R(-3, hy + 6, 1, 1, "#ffffff"); R(3, hy + 6, 1, 1, "#ffffff"); }
    }
    R(-4, hy + 4, 3, 1, hd); R(3, hy + 4, 3, 1, hd);
    R(-6, hy + 10, 2, 1, "#e79a8f"); R(6, hy + 10, 2, 1, "#e79a8f");
    if (a.status === "precisa") R(0, hy + 11, 3, 2, "#5a1f1c");
    else if (act) { R(-1, hy + 11, 5, 1, "#7a3b30"); R(-2, hy + 10, 1, 1, "#7a3b30"); R(4, hy + 10, 1, 1, "#7a3b30"); }
    else R(0, hy + 11, 3, 1, "#7a3b30");
  } else {
    switch (pal.cabelo) {
      case 1: RB(-9, hy - 3, 18, 22, hair); R(4, hy, 5, 19, hd); break;
      case 2: RB(-9, hy - 3, 18, 14, hair); RB(-4, hy - 8, 9, 5, hair); R(4, hy, 5, 11, hd); break;
      case 3: RB(-10, hy - 6, 20, 19, hair); RB(-12, hy - 2, 3, 10, hair); RB(9, hy - 2, 3, 10, hd); break;
      default: RB(-9, hy - 3, 18, 15, hair); R(4, hy, 5, 12, hd);
    }
    R(-10, hy + 6, 2, 4, sk);
  }
  g.globalAlpha = 1;
}

function bfs(s, goal) {
  const key = p => p.x + "," + p.y;
  if (s.x === goal.x && s.y === goal.y) return [];
  const prev = new Map([[key(s), null]]), q = [s];
  while (q.length) {
    const c = q.shift();
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const n = { x: c.x + dx, y: c.y + dy }, k = key(n);
      if (prev.has(k) || at(n.x, n.y) === null) continue;
      const isGoal = n.x === goal.x && n.y === goal.y;
      if (!isGoal && !walkable(n.x, n.y)) continue;
      prev.set(k, c);
      if (isGoal) { const path = []; let p = n; while (p && key(p) !== key(s)) { path.unshift(p); p = prev.get(key(p)); } return path; }
      q.push(n);

  const livres = SPOTS.filter(s => !ocupados.has(s.key));
  if (!livres.length) return;
  const outrosLivres = state.agents.filter(o => o !== a && o.status === "ocioso").length;
  const peso = s => {
    let p = (a.gostos[s.tipo] || 1) * (1 + state.agents.filter(o => o.spot && o.spot.tipo === s.tipo).length);
    if (s.tipo === "pingpong") {
      const esperando = state.agents.some(o => o.spot && o.spot.tipo === "pingpong");
      p *= esperando ? 4 : outrosLivres ? 1 : 0.1;          // alguém chamou para jogar? vai!
    }
    return p;
  };
  const total = livres.reduce((n, s) => n + peso(s), 0);
  let r = Math.random() * total, escolhido = livres[0];
  for (const s of livres) { r -= peso(s); if (r <= 0) { escolhido = s; break; } }
  a.spot = escolhido; a.arrived = false; a.activityLeft = rand(9, 16);
  goTo(a, escolhido.x, escolhido.y, () => {
    a.arrived = true; a.face = escolhido.face; a.flip = escolhido.flip; a.sitting = escolhido.sit; a.seatH = escolhido.seatH;
    const juntos = state.agents.filter(o => o !== a && o.spot && o.spot.tipo === escolhido.tipo && o.arrived);
    if (juntos.length) log(`${a.nome} se juntou a ${juntos.map(o => o.nome).join(" e ")} para ${ATIVIDADE_TXT[escolhido.tipo]}`);
  });
}
function ficarLivre(a, tarefa) {
  setStatus(a, "ocioso", tarefa || "Terminou a vez e espera a próxima instrução", false);
  a.idleLeft = a.real ? Infinity : rand(25, 50);
  a.atDesk = false;
  escolherAtividade(a);
  log(`${a.nome} terminou a vez e foi ${a.spot ? ATIVIDADE_TXT[a.spot.tipo] : "dar uma volta"}`);
}
function encerrar(a, silencioso = false) {
  liberarSpot(a);
  setStatus(a, "saindo", "Entregou o trabalho", false);
  if (!silencioso) log(`${a.nome} entregou o trabalho em <code>${a.projeto}</code> e foi embora 📦`);
  goTo(a, ELEVATOR.x, ELEVATOR.y, () => { state.elevatorOpen = 1.4; a.leaving = 0.001; a.face = "back"; });
}
function eventoDeTrabalho(a) {
  if (a._forcarLivre) { a._forcarLivre = false; ficarLivre(a); return; }
  const r = Math.random();
  const ativos = state.agents.filter(o => o.status !== "saindo" && !o.real).length;
  if (r < 0.40) setStatus(a, "trabalhando", pick(TAREFAS.filter(t => t !== a.tarefa)));
  else if (r < 0.55) setStatus(a, "precisa", pick(PEDIDOS));
  else if (r < 0.70) { setStatus(a, "shell", pick(COMANDOS)); a.timer = rand(7, 16); return; }
  else if (r < 0.95 || ativos <= 3) { ficarLivre(a); return; }
  else { encerrar(a); return; }
  a.timer = rand(6, 13);
}

/* Ping-pong: quando os dois lados estão ocupados, rola uma partida */
function atualizarPingPong(dt) {
  const jogadores = state.agents.filter(a => a.spot && a.spot.tipo === "pingpong" && a.arrived && a.status === "ocioso");
  if (jogadores.length >= 2) {
    if (!state.pp) { state.pp = { inicio: state.time, a: jogadores[0], b: jogadores[1] }; log(`${jogadores[0].nome} e ${jogadores[1].nome} começaram uma partida de ping-pong 🏓`); }
    if (state.time - state.pp.inicio > 20) {
      const [v, p] = Math.random() < 0.5 ? [state.pp.a, state.pp.b] : [state.pp.b, state.pp.a];
      log(`${v.nome} ganhou de ${p.nome} no ping-pong: 5 × ${Math.floor(rand(1, 5))}`);
      state.pp = null;
      for (const j of jogadores) { liberarSpot(j); if (j.idleLeft > 4) escolherAtividade(j); }
    }
  } else state.pp = null;
}

function update(dt) {
  state.time += dt;
  state.elevatorOpen = Math.max(0, state.elevatorOpen - dt);
  state.gol = Math.max(0, state.gol - dt);

  for (const a of [...state.agents]) {
    if (a.path.length) {
      const n = a.path[0], tx = n.x + 0.5, ty = n.y + 0.5;
      const dx = tx - a.px, dy = ty - a.py, d = Math.hypot(dx, dy);
      const sp = 2.3 * dt * (a.status === "precisa" ? 1.9 : 1);
      a.walking = true; a.walkT += dt * (a.status === "precisa" ? 1.9 : 1);
      Object.assign(a, faceDe(dx, dy));
      if (d <= sp) { a.px = tx; a.py = ty; a.path.shift(); if (!a.path.length) { a.walking = false; const cb = a.onArrive; a.onArrive = null; cb && cb(); } }
      else { a.px += dx / d * sp; a.py += dy / d * sp; }
    } else a.walking = false;

    if (a.leaving > 0) { a.leaving += dt * 1.6; if (a.leaving >= 1) { state.agents.splice(state.agents.indexOf(a), 1); if (state.selected === a.id) state.selected = null; state.uiDirty = true; } continue; }

    switch (a.status) {
      case "trabalhando":
        if (a.atDesk && !a.real) { a.timer -= dt; if (a.timer <= 0) eventoDeTrabalho(a); }
        break;
      case "shell":
        if (a.real) break;
        a.timer -= dt;
        if (a.timer <= 0) {
          const ok = Math.random() < 0.75;
          log(ok ? `${a.nome}: <code>${a.tarefa}</code> terminou sem erros 🎉` : `${a.nome}: <code>${a.tarefa}</code> falhou 🌧️`, ok ? "" : "alert");
          setStatus(a, "trabalhando", ok ? pick(TAREFAS) : "Investigando a falha do comando", false); a.timer = rand(6, 12);
        }
        break;
      case "ocioso": {
        a.idleLeft -= dt;
        const emPartida = state.pp && (state.pp.a === a || state.pp.b === a);
        if (a.arrived && a.spot && !emPartida) {
          a.activityLeft -= dt;
          if (a.spot.tipo === "futebol" && Math.random() < dt * 0.04 && state.gol <= 0) {
            state.gol = 2.5;
            const torcida = state.agents.filter(o => o.spot && o.spot.tipo === "futebol" && o.arrived).map(o => o.nome);
            log(`GOL! ${torcida.join(" e ")} ${torcida.length > 1 ? "comemoram" : "comemora"} no sofá ⚽`);
          }
          if (a.activityLeft <= 0 && a.idleLeft > 4) { liberarSpot(a); escolherAtividade(a); }
        }
        if (a.idleLeft <= 0 && !a.path.length) {
          log(`${a.nome} recebeu uma nova instrução e voltou para a mesa`);
          setStatus(a, "trabalhando", pick(TAREFAS), false); a.timer = rand(6, 12);
          voltarParaMesa(a);
        }
        break;
      }
    }
  }
  atualizarPingPong(dt);

  // luz de cada cômodo acende quando tem gente (só faz diferença à noite)
  for (const z of FLOORS) {
    const ocupado = state.agents.some(a => a.leaving === 0 && floorOf(Math.floor(a.px), Math.floor(a.py)) === z);
    state.luz[z] += ((ocupado ? 1 : 0) - state.luz[z]) * Math.min(1, dt * 2.5);
  }

  if (state.demo) {
    state.spawnIn = (state.spawnIn ?? 6) - dt;
    const demos = state.agents.filter(a => !a.real && a.leaving === 0).length;
    if (state.spawnIn <= 0) { state.spawnIn = rand(25, 45); if (demos < 7) criarAgente(); }
  }
}

function responder(a, aprovado) {
  if (!a || a.status !== "precisa") return;
  log(aprovado ? `Você aprovou o pedido de ${a.nome} ✅` : `Você negou o pedido de ${a.nome}; ele vai seguir por outro caminho`);
  setStatus(a, "trabalhando", aprovado ? pick(TAREFAS) : "Procurando outra abordagem", false); a.timer = rand(6, 12);
}
function enviarInstrucao(a) {
  if (!a || a.status !== "ocioso") return;
  log(`Você mandou uma nova instrução para ${a.nome}`);
  setStatus(a, "trabalhando", pick(TAREFAS), false); a.timer = rand(6, 12);
  voltarParaMesa(a);
}

/* =====================================================================
   DESENHO DE CADA QUADRO
   ===================================================================== */
function drawElevator() {
  const e = ELEVATOR.x, open = state.elevatorOpen > 0 ? Math.min(1, state.elevatorOpen * 3) : 0;
  quadY(0, e - 0.2, e + 1.2, 0, 92, "#6f7d84");
  quadY(0, e - 0.14, e + 1.14, 0, 88, "#8d9aa0");
  quadY(0, e + 0.04, e + 0.96, 0, 80, "#141b1e");
  if (open) quadY(0, e + 0.3, e + 0.7, 0, 80, "#f3e1a8");
  const half = 0.46 * (1 - open);
  quadY(0, e + 0.04, e + 0.04 + half, 0, 80, "#b9c4c9"); quadY(0, e + 0.96 - half, e + 0.96, 0, 80, "#aeb9be");
  if (half > 0.05) { quadY(0, e + 0.04 + half - 0.02, e + 0.04 + half, 0, 80, "#8b979c"); quadY(0, e + 0.96 - half, e + 0.98 - half, 0, 80, "#8b979c"); }
  quadY(0, e + 0.38, e + 0.62, 83, 87, "#2b3236");
  quadY(0, e + 0.42, e + 0.58, 84, 86, open ? "#57d38c" : "#e3a32f");
  prism(e + 1.18, 0, 0.08, 0.06, 40, 12, "#5d6a70", { edge:false });
}

function bolinha(t) {
  if (!state.pp) return null;
  const mesa = SPOTS.filter(s => s.tipo === "pingpong");
  if (mesa.length < 2) return null;
  const [s1, s2] = mesa.sort((p, q) => p.x - q.x);
  const u = (t * 0.9) % 2, f = u < 1 ? u : 2 - u;
  const x = s1.x + 0.9 + f * (s2.x - s1.x - 0.8), y = s1.y + 0.5;
  const z = 30 + 18 * Math.abs(Math.sin(f * Math.PI * 2));
  return { x, y, z };
}

const DIA_LUZES = [];
function luzDoDia(F) {
  if (F.noite) return;
  g.globalCompositeOperation = "lighter";
  const cor = F.dark ? "rgba(255,170,90,.10)" : "rgba(255,246,220,.09)";
  for (const [a, b] of JANELAS_FUNDO) fillPoly([P(a, 0.05), P(b, 0.05), P(b + 1.2, 3.2), P(a + 1.2, 3.2)], cor);
  for (const [a, b] of JANELAS_LADO) fillPoly([P(0.05, a), P(0.05, b), P(3.2, b + 1.2), P(3.2, a + 1.2)], cor);
  g.globalCompositeOperation = "source-over";
}

/* Lâmpadas de teto: uma a cada 4 tiles, por cômodo */
const LAMPADAS = [];
for (let y = 2; y < ROWS; y += 4) for (let x = 2; x < COLS; x += 4) {
  const c = at(x, y); if (c === "#") continue;
  LAMPADAS.push({ x: x + 0.5, y: y + 0.5, zona: floorOf(x, y), r: 190 });
}
function brilho(ctx, wx, wy, r, rgb, k, z = 24) {
  const p = P(wx, wy, z);
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(1, 0.62);
  const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  gr.addColorStop(0, `rgba(${rgb},${k})`); gr.addColorStop(0.55, `rgba(${rgb},${k * 0.55})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function aplicarLuz(t, F) {
  if (!F.dark) return;
  lg.globalCompositeOperation = "source-over";
  lg.clearRect(0, 0, LW, LH);
  lg.fillStyle = `rgba(8,12,34,${F.dark})`;
  lg.fillRect(0, 0, LW, LH);
  lg.globalCompositeOperation = "destination-out";
  const acesas = [];
  for (const L of LAMPADAS) { const k = state.luz[L.zona]; if (k > 0.02) acesas.push({ x:L.x, y:L.y, r:L.r, k, cor:"255,196,130", z:40 }); }
  for (const L of LUZES_FIXAS) {
    if (L.dinamica) { const d = L.dinamica(t); if (d) acesas.push({ ...d, z: 30 }); }
    else acesas.push({ ...L, k: Math.max(0.55, state.luz[L.zona] || 0), cor:"255,206,140" });
  }
  for (const L of acesas) brilho(lg, L.x, L.y, L.r, "0,0,0", 0.95 * L.k, L.z);
  main.drawImage(lightCanvas, 0, 0);
  main.globalCompositeOperation = "lighter";
  for (const L of acesas) brilho(main, L.x, L.y, L.r * 0.8, L.cor, 0.13 * L.k, L.z);
  main.globalCompositeOperation = "source-over";
  if (F.tint) { main.fillStyle = F.tint; main.fillRect(0, 0, LW, LH); }
}

function draw(t) {
  atualizarFundo();
  const F = FASES[faseAtual()];
  g = main;
  g.clearRect(0, 0, LW, LH);
  g.drawImage(bg, 0, 0);
  luzDoDia(F);
  drawElevator();

  const sel = state.agents.find(a => a.id === state.selected);
  if (sel) { const tl = tileOf(sel); tileDiamond(tl.x, tl.y, "rgba(227,163,47,.5)"); }

  const items = MOV.slice();
  for (const a of state.agents) items.push({ depth: profundidade(a.px, a.py), kind: 1, dyn: () => drawAgent(a, t) });
  const b = bolinha(t);
  if (b) items.push({ depth: profundidade(b.x, b.y) + 0.2, kind: 2, dyn: () => { const p = P(b.x, b.y, b.z), s = P(b.x, b.y, 25.5); g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(Math.round(s.x) - 2, Math.round(s.y), 4, 1); g.fillStyle = "#fff8e8"; g.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 3, 3); } });
  items.sort((p, q) => p.depth - q.depth || p.kind - q.kind);
  for (const it of items) { if (it.img) g.drawImage(it.img, it.ix, it.iy); else it.dyn(t); }

  if (F.dark) aplicarLuz(t, F);
  else if (F.tint) { g.fillStyle = F.tint; g.fillRect(0, 0, LW, LH); }

  apresentar(t);
}

/* =====================================================================
   CÂMERA: ajustar, aproximar e arrastar
   ===================================================================== */
const cam = { zoom: 1, cx: LW / 2, cy: LH / 2 };   // zoom 1 = ver tudo
let stageColor = "#28373d";
const readStage = () => { stageColor = getComputedStyle(document.documentElement).getPropertyValue("--stage").trim() || "#28373d"; };
readStage();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readStage);

function camInfo() {
  const fit = Math.min(view.width / LW, view.height / LH);
  let s = fit * cam.zoom;
  if (s >= 1.5) s = Math.round(s);
  const hw = view.width / 2 / s, hh = view.height / 2 / s;
  let cx = cam.cx, cy = cam.cy;
  cx = hw * 2 >= LW ? LW / 2 : Math.max(hw, Math.min(LW - hw, cx));
  cy = hh * 2 >= LH ? LH / 2 : Math.max(hh, Math.min(LH - hh, cy));
  cam.cx = cx; cam.cy = cy;
  return { s, cx, cy };
}
const toScreen = (ax, ay, k) => ({ x: (ax - k.cx) * k.s + view.width / 2, y: (ay - k.cy) * k.s + view.height / 2 });
const toArt = (sx, sy, k) => ({ x: (sx - view.width / 2) / k.s + k.cx, y: (sy - view.height / 2) / k.s + k.cy });

function bubbleFor(a, t) {
  if (a.leaving > 0) return null;
  switch (a.status) {
    case "chegando": return { icon: "👋" };
    case "saindo": return { icon: "📦" };
    case "trabalhando": return a.atDesk ? { icon: "⌨️" } : null;
    case "precisa": return { icon: "✋", alert: true, blink: Math.sin(t * 7) > 0 };
    case "shell": return { icon: state.time - a.since > 6 ? "🍿" : "⏳" };
    case "ocioso":
      if (!(a.spot && a.arrived)) return null;
      if (a.spot.tipo === "conversa") return { icon: Math.sin(t * 0.8 + a.seed * 3) > 0.3 ? "😂" : "💬" };
      if (a.spot.tipo === "futebol" && state.gol > 0) return { icon: "🎉" };
      return { icon: ICONES[a.spot.tipo] };
  }
  return null;
}

function apresentar(t) {
  const k = camInfo();
  vg.setTransform(1, 0, 0, 1, 0, 0);
  vg.fillStyle = stageColor; vg.fillRect(0, 0, view.width, view.height);
  vg.imageSmoothingEnabled = k.s < 1;
  vg.imageSmoothingQuality = "high";
  const o = toScreen(0, 0, k);
  vg.drawImage(low, Math.round(o.x), Math.round(o.y), Math.round(LW * k.s), Math.round(LH * k.s));

  const dpr = window.devicePixelRatio || 1;
  const u = Math.min(1.7 * dpr, Math.max(0.8 * dpr, k.s * 0.75));
  vg.textAlign = "center"; vg.textBaseline = "middle";
  const ordered = [...state.agents].sort((p, q) => profundidade(p.px, p.py) - profundidade(q.px, q.py));
  for (const a of ordered) {
    const c = P(a.px, a.py, 0);
    const seat = a.sitting ? (a.seatH || 14) : 0;
    const head = toScreen(c.x, c.y - seat - (a.sitting ? 40 : 55), k);
    const foot = toScreen(c.x, c.y + 8, k);
    const sel = a.id === state.selected;
    vg.font = `600 ${11 * u}px "Pixelify Sans", sans-serif`;
    const nw = vg.measureText(a.nome).width + 8 * u;
    vg.fillStyle = sel ? "#e3a32f" : "rgba(15,20,24,.75)";
    vg.fillRect(foot.x - nw / 2, foot.y - 7 * u, nw, 14 * u);
    vg.fillStyle = sel ? "#2a1d05" : "#ffffff";
    vg.fillText(a.nome, foot.x, foot.y + 0.5 * u);
    const b = bubbleFor(a, t);
    if (!b) continue;
    const r = 12 * u, bx = head.x, by = head.y - r - 4 * u;
    vg.fillStyle = b.alert && b.blink ? "#c9443d" : "#ffffff";
    vg.strokeStyle = b.alert ? "#c9443d" : "#1d292c"; vg.lineWidth = 2 * u;
    vg.beginPath(); vg.rect(bx - r, by - r, r * 2, r * 2); vg.fill(); vg.stroke();
    vg.beginPath(); vg.moveTo(bx - 4 * u, by + r); vg.lineTo(bx, by + r + 5 * u); vg.lineTo(bx + 4 * u, by + r); vg.closePath(); vg.fill(); vg.stroke();
    vg.fillRect(bx - 3 * u, by + r - 2 * u, 6 * u, 3 * u);
    vg.font = `${13 * u}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    vg.fillText(b.icon, bx, by + 1 * u);
  }
}

/* =====================================================================
   INTERFACE
   ===================================================================== */
const $ = id => document.getElementById(id);
function log(html, kind = "") {
  const li = document.createElement("li");
  li.innerHTML = `<time>${new Date().toLocaleTimeString("pt-BR")}</time><span>${html}</span>`;
  if (kind === "alert") li.style.color = "var(--alert)";
  $("feed").prepend(li);
  while ($("feed").children.length > 60) $("feed").lastChild.remove();
}

function renderUI() {
  const ag = state.agents.filter(a => a.leaving === 0);
  const n = st => ag.filter(a => a.status === st).length;
  const precisam = n("precisa");
  $("counters").innerHTML = `
    <span class="chip"><b>${ag.length}</b> no escritório</span>
    <span class="chip"><b>${n("trabalhando") + n("shell")}</b> trabalhando</span>
    <span class="chip ${precisam ? "alert" : ""}"><b>${precisam}</b> precisam de você</span>
    <span class="chip"><b>${n("ocioso")}</b> livres</span>`;

  $("list").innerHTML = ag.length ? ag.map(a => `
    <li><button data-id="${a.id}" aria-pressed="${a.id === state.selected}">
      <span class="swatch" style="background:${a.pal.shirt}"></span>
      <span class="who">${a.nome}<small>${a.projeto}</small></span>
      <span class="pill s-${a.status}">${STATUS_TXT[a.status]}</span>
    </button></li>`).join("") : `<li class="empty">Ninguém por aqui. Abra o Claude Code ou ligue a demonstração.</li>`;

  const a = state.agents.find(x => x.id === state.selected);
  if (!a) {
    $("details").innerHTML = `<h2>Detalhes</h2><p class="empty">Clique em um agente na sala ou na lista para ver o que ele está fazendo.</p>`;
  } else {
    let acoes = "";
    if (a.real) acoes = a.status === "precisa" ? `<p class="empty">Responda no terminal do Claude Code.</p>` : a.status === "ocioso" ? `<p class="empty">Mande o próximo pedido pelo terminal.</p>` : "";
    else if (a.status === "precisa") acoes = `<button class="btn primary" data-act="aprovar">Aprovar</button><button class="btn" data-act="negar">Negar</button>`;
    else if (a.status === "ocioso") acoes = `<button class="btn primary" data-act="instrucao">Enviar instrução</button><button class="btn danger" data-act="encerrar">Encerrar sessão</button>`;
    else if (a.status === "trabalhando" || a.status === "shell") acoes = `<button class="btn danger" data-act="encerrar">Encerrar sessão</button>`;
    const agora = a.status === "ocioso" && a.spot ? `Foi ${ATIVIDADE_TXT[a.spot.tipo]}` : (a.status === "shell" ? `Esperando <code>${a.tarefa}</code>` : a.tarefa);
    $("details").innerHTML = `
      <h2>${a.nome}</h2>
      <p><span class="pill s-${a.status}">${STATUS_TXT[a.status]}</span></p>
      <span class="label">Projeto</span><p><code>${a.projeto}</code></p>
      <span class="label">Origem</span><p>${a.real ? "Sessão do Claude Code" : "Demonstração"}</p>
      <span class="label">Agora</span><p>${agora}</p>
      <span class="label">Jeito</span><p>${a.jeito}</p>
      <div class="actions">${acoes}</div>`;
  }

  const waiting = ag.filter(a => a.status === "precisa");
  $("toast").innerHTML = waiting.map(a => `<button data-id="${a.id}">✋ ${a.nome} precisa de você: ${a.tarefa}</button>`).join("");
  $("btnAdd").disabled = !freeDesk();
  $("btnAdd").hidden = !state.demo;
  $("btnDemo").textContent = state.demo ? "Desligar demonstração" : "Ligar demonstração";
  $("btnHora").textContent = `Hora: ${state.faseFixa ? FASES[state.faseFixa].nome : "automática"}`;
  const reais = ag.filter(x => x.real).length;
  $("sub").textContent = state.modo === "servidor"
    ? (reais ? `Conectado ao Claude Code: ${reais} ${reais > 1 ? "sessões abertas" : "sessão aberta"}.` : "Conectado. Abra o Claude Code em algum projeto para os agentes aparecerem.") + (state.demo ? " Agentes da demonstração são fictícios." : "")
    : state.modo === "reconectando" ? "Conexão com o servidor caiu. Tentando de novo…"
    : state.modo === "offline" ? "Sem servidor: só a demonstração está rodando. Use npm start para ver o Claude Code."
    : "Conectando ao servidor…";
}

$("list").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) { state.selected = +b.dataset.id; state.uiDirty = true; } });
$("toast").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) { state.selected = +b.dataset.id; state.uiDirty = true; } });
$("details").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const a = state.agents.find(x => x.id === state.selected);
  ({ aprovar: () => responder(a, true), negar: () => responder(a, false), instrucao: () => enviarInstrucao(a), encerrar: () => encerrar(a) })[b.dataset.act]();
  state.uiDirty = true;
});
$("btnAdd").addEventListener("click", () => { const a = criarAgente(); if (a) state.selected = a.id; });
$("btnPause").addEventListener("click", () => { state.paused = !state.paused; $("btnPause").textContent = state.paused ? "Continuar" : "Pausar"; });
$("btnSpeed").addEventListener("click", () => { state.speed = state.speed === 1 ? 2 : state.speed === 2 ? 4 : 1; $("btnSpeed").textContent = `Velocidade ${state.speed}×`; });
$("btnHora").addEventListener("click", () => {
  const ordem = [null, "dia", "entardecer", "noite"];
  state.faseFixa = ordem[(ordem.indexOf(state.faseFixa) + 1) % ordem.length];
  state.uiDirty = true;
});
const ZOOMS = [1, 1.5, 2, 3, 4];
const zoomPara = (z, foco) => {
  const k = camInfo();
  if (foco) { const a = toArt(foco.x, foco.y, k); cam.cx = a.x; cam.cy = a.y; }
  cam.zoom = z;
};
$("btnZoomIn").addEventListener("click", () => zoomPara(ZOOMS.find(z => z > cam.zoom) || cam.zoom));
$("btnZoomOut").addEventListener("click", () => zoomPara([...ZOOMS].reverse().find(z => z < cam.zoom) || 1));
$("btnFit").addEventListener("click", () => { cam.zoom = 1; cam.cx = LW / 2; cam.cy = LH / 2; });

function agentAt(px, py) {
  const k = camInfo(), p = toArt(px, py, k);
  const ordered = [...state.agents].sort((p1, q) => profundidade(q.px, q.py) - profundidade(p1.px, p1.py));
  return ordered.find(a => {
    const c = P(a.px, a.py), seat = a.sitting ? (a.seatH || 14) : 0, h = a.sitting ? 44 : 56;
    return p.x > c.x - 14 && p.x < c.x + 14 && p.y > c.y - seat - h && p.y < c.y + 8;
  });
}
const pos = ev => { const r = view.getBoundingClientRect(); const d = view.width / r.width; return { x: (ev.clientX - r.left) * d, y: (ev.clientY - r.top) * d }; };
let drag = null;
view.addEventListener("pointerdown", ev => { drag = { ...pos(ev), moved: 0 }; view.setPointerCapture(ev.pointerId); });
view.addEventListener("pointermove", ev => {
  const p = pos(ev);
  if (drag) {
    const k = camInfo(), dx = p.x - drag.x, dy = p.y - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.moved > 6) { view.classList.add("dragging"); cam.cx -= dx / k.s; cam.cy -= dy / k.s; }
    drag.x = p.x; drag.y = p.y;
  } else view.style.cursor = agentAt(p.x, p.y) ? "pointer" : "";
});
view.addEventListener("pointerup", ev => {
  const p = pos(ev);
  if (drag && drag.moved <= 6) { const a = agentAt(p.x, p.y); state.selected = a ? a.id : null; state.uiDirty = true; }
  drag = null; view.classList.remove("dragging");
});
view.addEventListener("dblclick", ev => zoomPara(cam.zoom >= 2 ? 1 : 2, pos(ev)));

function resize() {
  const dpr = window.devicePixelRatio || 1, w = $("stage").clientWidth;
  const h = Math.max(w * LH / LW, Math.min(420, w * 0.9));
  view.width = Math.round(w * dpr); view.height = Math.round(h * dpr);
  view.style.height = h + "px";
}
new ResizeObserver(resize).observe($("stage"));
resize();

/* =====================================================================
   DEMONSTRAÇÃO E SESSÕES REAIS (servidor)
   ===================================================================== */
function iniciarDemo() {
  if (state.agents.some(a => !a.real && a.leaving === 0 && a.status !== "saindo")) return;
  for (let i = 0; i < 5; i++) if (!criarAgente({ jaSentado: true })) break;
  const d = state.agents.filter(a => !a.real);
  // alguns ficam livres logo no começo, para a vida social aparecer
  [[1, 2.5], [2, 4], [3, 6]].forEach(([i, tm]) => { if (d[i]) { d[i].timer = tm; d[i]._forcarLivre = true; } });
  log("Demonstração ligada: estes agentes são fictícios.");
}
function pararDemo() {
  state.agents.filter(a => !a.real && a.status !== "saindo").forEach(a => encerrar(a, true));
  log("Demonstração desligada.");
}
function setDemo(on) { if (on === state.demo) return; state.demo = on; on ? iniciarDemo() : pararDemo(); state.uiDirty = true; }

function aplicarStatusReal(a, s) {
  if (a.status === "chegando") { a.pendente = s; return; }
  if (a.status === "saindo") return;
  if (s.status === a.status && s.tarefa === a.tarefa) return;
  if (s.status === "ocioso") { if (a.status !== "ocioso") ficarLivre(a, s.tarefa); else a.tarefa = s.tarefa; state.uiDirty = true; return; }
  setStatus(a, s.status, s.tarefa);
  const destino = a.path[a.path.length - 1];
  const indoPraMesa = destino && destino.x === a.desk.x && destino.y === a.desk.y;
  if (!a.atDesk && !indoPraMesa) voltarParaMesa(a);
}
function aplicarSnapshot(snap) {
  setDemo(!!snap.demo);
  const vistos = new Set();
  for (const s of snap.agentes) {
    vistos.add(s.id);
    let a = state.agents.find(x => x.sid === s.id && x.status !== "saindo");
    if (!a) { a = criarAgente({ sid: s.id, projeto: s.projeto, real: true }); if (a) a.pendente = s; continue; }
    a.projeto = s.projeto;
    aplicarStatusReal(a, s);
  }
  for (const a of state.agents) if (a.real && !vistos.has(a.sid) && a.status !== "saindo") encerrar(a);
  state.uiDirty = true;
}
function conectar() {
  if (location.protocol === "file:" || !window.EventSource) { state.modo = "offline"; setDemo(true); return; }
  const es = new EventSource("/api/stream");
  es.addEventListener("snapshot", e => { state.modo = "servidor"; aplicarSnapshot(JSON.parse(e.data)); });
  es.onerror = () => {
    if (state.modo === "servidor") state.modo = "reconectando";
    else if (state.modo !== "reconectando") { state.modo = "offline"; setDemo(true); }
    state.uiDirty = true;
  };
}
$("btnDemo").addEventListener("click", () => {
  if (state.modo === "servidor") fetch("/api/demo", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ enabled: !state.demo }) });
  else setDemo(!state.demo);
});

window.escritorio = {
  adicionarAgente: criarAgente,
  agentes: () => state.agents,
  definirStatus: (id, status, texto) => { const a = state.agents.find(x => x.id === id); if (a) setStatus(a, status, texto); },
  hora: fase => { state.faseFixa = fase || null; state.uiDirty = true; },
};

prepararMoveis();
conectar();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!state.paused) update(dt * state.speed);
  draw(now / 1000);
  if (state.uiDirty) { state.uiDirty = false; renderUI(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
