<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI AgentSquad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/escritorio.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>AI AgentSquad</h1>
      <div class="sub" id="sub">Conectando ao servidor…</div>
    </div>
    <div class="counters" id="counters"></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="view" aria-label="Escritório em pixel art com os agentes" role="img"></canvas>
    <div class="toast" id="toast"></div>
    <div class="toolbar">
      <button class="btn primary" id="btnAdd">Adicionar agente</button>
      <button class="btn" id="btnDemo">Ligar demonstração</button>
      <button class="btn" id="btnPause">Pausar</button>
      <button class="btn" id="btnSpeed">Velocidade 1×</button>
      <button class="btn" id="btnHora">Hora: automática</button>
      <button class="btn" id="btnAvisos" aria-pressed="false">Avisos desligados</button>
    </div>
    <div class="zoombar">
      <button class="btn sq" id="btnZoomOut" aria-label="Afastar">−</button>
      <button class="btn sq" id="btnZoomIn" aria-label="Aproximar">+</button>
      <button class="btn" id="btnFit">Ver tudo</button>
    </div>
  </div>

  <aside>
    <section class="panel">
      <h2>Agentes</h2>
      <ul class="list" id="list"></ul>
    </section>
    <section class="panel details" id="details"></section>
  </aside>

  <section class="panel feed">
    <h2>Atividade</h2>
    <ol id="feed"></ol>
  </section>
</div>
<script src="js/planta.js"></script>
<script src="js/motor.js"></script>
<script src="js/cenario.js"></script>
<script src="js/moveis.js"></script>
<script src="js/personagem.js"></script>
<script src="js/simulacao.js"></script>
<script src="js/quadro.js"></script>
<script src="js/interface.js"></script>
<script src="js/conexao.js"></script>
</body>
</html>
